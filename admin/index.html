<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — AELITA PRODUCTION</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0D;--coal:#1A1A1F;--bone:#E8E6E1;--sand:#C9B8A3;--gold:#D6B57A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden}
body{background:var(--ink);color:var(--bone);font-family:'Inter',system-ui,sans-serif;font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

nav{padding:20px 0;border-bottom:1px solid rgba(232,230,225,.07)}
.nav-in{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Montserrat',sans-serif;font-weight:300;letter-spacing:.4em;font-size:14px}
.logo small{display:block;font-size:8px;letter-spacing:.6em;color:var(--sand);margin-top:2px}
.nav-back{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--sand)}

main{padding:48px 0 100px}
.eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
h1{font-family:'Montserrat',sans-serif;font-weight:200;font-size:clamp(22px,4vw,30px);letter-spacing:.06em;margin-bottom:40px}

/* Вход */
.gate{max-width:380px;margin:60px auto 0}
.gate .field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.gate label{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--sand)}
.gate input{background:rgba(232,230,225,.05);border:1px solid rgba(201,184,163,.2);padding:14px 16px;color:var(--bone);font-family:'Inter',sans-serif;font-size:14px;width:100%}
.gate input:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--gold);color:var(--ink);font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:14px 28px;border:none;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:default}
.err{font-size:13px;color:#e08a6e;margin-top:10px;display:none}

/* Статистика */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(201,184,163,.15);margin-bottom:40px}
.stat-box{background:var(--coal);padding:22px 20px}
.stat-box .label{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);margin-bottom:10px}
.stat-box .value{font-family:'Montserrat',sans-serif;font-size:24px;color:var(--gold)}
@media(max-width:760px){.stats-grid{grid-template-columns:1fr 1fr}}

.byproduct{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.byproduct .chip{background:var(--coal);padding:10px 16px;font-size:13px;color:var(--sand)}
.byproduct .chip strong{color:var(--bone)}

.links-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:48px}
.links-row a{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(214,181,122,.35);padding:10px 18px}

/* Клиенты */
.sec-title{font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);margin-bottom:16px}
.search{background:rgba(232,230,225,.05);border:1px solid rgba(201,184,163,.2);padding:12px 16px;color:var(--bone);font-family:'Inter',sans-serif;font-size:14px;width:100%;max-width:320px;margin-bottom:20px}
.search:focus{outline:none;border-color:var(--gold)}

.cust{display:flex;flex-direction:column;gap:1px;background:rgba(201,184,163,.15)}
.cust-item{background:var(--ink);padding:20px 22px}
.cust-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.cust-email{font-family:'Montserrat',sans-serif;font-size:14px}
.cust-meta{color:var(--sand);font-size:12px}
.cust-total{font-family:'Montserrat',sans-serif;font-size:15px;color:var(--gold);white-space:nowrap}
.purchase-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--sand);margin-top:10px;padding-top:10px;border-top:1px solid rgba(201,184,163,.1)}
.purchase-row .name{color:var(--bone)}

.empty-state,#loadingState{padding:60px 20px;text-align:center;color:var(--sand);background:var(--coal)}
#errorState{padding:40px 20px;text-align:center;color:#e08a6e;background:var(--coal);display:none}
</style>
</head>
<body>

<nav>
<div class="nav-in">
<a class="logo" href="/">АЭЛИТА<small>ПРОДАКШЕН</small></a>
<a class="nav-back" href="/">← На сайт</a>
</div>
</nav>

<main>
<div class="wrap">

<div id="gateScreen">
  <div class="gate">
    <p class="eyebrow">Только для команды</p>
    <h1 style="margin-bottom:28px">Вход в админку</h1>
    <div class="field">
      <label for="admin-password">Пароль</label>
      <input type="password" id="admin-password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Войти →</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div id="dataScreen" style="display:none">
  <p class="eyebrow">Только для команды</p>
  <h1>Клиенты, покупки, статистика</h1>

  <div id="loadingState">Загружаем данные…</div>
  <div id="errorState"></div>

  <div id="content" style="display:none">
    <div class="stats-grid">
      <div class="stat-box"><div class="label">Клиентов всего</div><div class="value" id="s-total-customers">—</div></div>
      <div class="stat-box"><div class="label">Выручка всего</div><div class="value" id="s-total-revenue">—</div></div>
      <div class="stat-box"><div class="label">Новых за 30 дней</div><div class="value" id="s-new-30d">—</div></div>
      <div class="stat-box"><div class="label">Выручка за 30 дней</div><div class="value" id="s-rev-30d">—</div></div>
    </div>

    <div class="byproduct" id="byProduct"></div>

    <div class="links-row" id="adminLinks"></div>

    <p class="sec-title">Клиенты (<span id="cust-count">0</span>)</p>
    <input type="text" class="search" id="custSearch" placeholder="Поиск по email…">
    <div class="cust" id="custList"></div>
  </div>
</div>

</div>
</main>

<script>
// ЗАПОЛНИТЬ после деплоя _tools/Admin/login.js и data.js — до
// заполнения страница показывает понятное сообщение, не ломается.
var ADMIN_LOGIN_URL = '';
var ADMIN_DATA_URL = '';

var STORAGE_KEY = 'aelita_admin_token';

function getToken() {
  try { return sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  // sessionStorage, не localStorage — токен админки живёт максимум до
  // закрытия вкладки, не переживает перезапуск браузера. TTL на
  // сервере и так короче (12ч), это дополнительная, не единственная
  // защита — сознательно строже, чем у клиентского кабинета.
}
function setToken(t) { try { sessionStorage.setItem(STORAGE_KEY, t); } catch (e) {} }
function clearToken() { try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {} }

function fmtMoney(n) {
  if (n == null || !isFinite(n)) return '—';
  return Math.round(n).toLocaleString('ru-RU') + ' ₽';
}
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch (e) { return iso; }
}

var PRODUCT_NAMES = { community: 'AELITA COMMUNITY', concierge: 'Книжный консьерж', gift: 'Подарочная карта' };

var allCustomers = [];

function renderStats(stats) {
  document.getElementById('s-total-customers').textContent = stats.totalCustomers;
  document.getElementById('s-total-revenue').textContent = fmtMoney(stats.totalRevenue);
  document.getElementById('s-new-30d').textContent = stats.newCustomersLast30Days;
  document.getElementById('s-rev-30d').textContent = fmtMoney(stats.revenueLast30Days);

  var byProductEl = document.getElementById('byProduct');
  var entries = Object.keys(stats.byProduct || {});
  if (!entries.length) {
    byProductEl.innerHTML = '';
  } else {
    byProductEl.innerHTML = entries.map(function (key) {
      var p = stats.byProduct[key];
      var label = p.label || PRODUCT_NAMES[key] || key;
      return '<div class="chip"><strong>' + label + '</strong> — ' + p.count + ' · ' + fmtMoney(p.revenue) + '</div>';
    }).join('');
  }
}

function renderLinks(links) {
  var el = document.getElementById('adminLinks');
  var out = [];
  if (links && links.analyticsWeeklyReport) out.push('<a href="' + links.analyticsWeeklyReport + '" target="_blank" rel="noopener">Недельный отчёт аналитики →</a>');
  if (links && links.yookassaDashboard) out.push('<a href="' + links.yookassaDashboard + '" target="_blank" rel="noopener">Личный кабинет ЮKassa →</a>');
  el.innerHTML = out.join('');
}

function renderCustomers(list) {
  document.getElementById('cust-count').textContent = list.length;
  var el = document.getElementById('custList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
    return;
  }
  el.innerHTML = list.map(function (c) {
    var purchasesHtml = (c.purchases || []).map(function (p) {
      var name = p.productLabel || PRODUCT_NAMES[p.product] || p.product || 'Покупка';
      return '<div class="purchase-row"><span class="name">' + name + '</span><span>' + fmtDate(p.paidAt) + ' · ' + fmtMoney(p.amount) + '</span></div>';
    }).join('');
    return '<div class="cust-item">' +
      '<div class="cust-head">' +
        '<div><div class="cust-email">' + c.email + '</div><div class="cust-meta">с ' + fmtDate(c.createdAt) + ' · ' + c.purchaseCount + ' ' + 'покупок' + '</div></div>' +
        '<div class="cust-total">' + fmtMoney(c.totalSpent) + '</div>' +
      '</div>' +
      purchasesHtml +
    '</div>';
  }).join('');
}

document.getElementById('custSearch').addEventListener('input', function (e) {
  var q = e.target.value.trim().toLowerCase();
  var filtered = q ? allCustomers.filter(function (c) { return c.email.toLowerCase().indexOf(q) !== -1; }) : allCustomers;
  renderCustomers(filtered);
});

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  var el = document.getElementById('errorState');
  el.textContent = msg;
  el.style.display = 'block';
}

async function loadData() {
  if (!ADMIN_DATA_URL) { showError('Админка ещё не подключена — заполните ADMIN_DATA_URL после деплоя _tools/Admin/.'); return; }
  var token = getToken();
  if (!token) { showGate(); return; }
  try {
    var res = await fetch(ADMIN_DATA_URL, { headers: { Authorization: 'Bearer ' + token } });
    if (res.status === 401) { clearToken(); showGate(); return; }
    var data = await res.json();
    if (!res.ok) { showError((data && data.error) || 'Не получилось загрузить данные.'); return; }
    allCustomers = data.customers || [];
    renderStats(data.stats || {});
    renderLinks(data.adminLinks || {});
    renderCustomers(allCustomers);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    showError('Не получилось связаться с сервером. Попробуйте ещё раз.');
  }
}

function showGate() {
  document.getElementById('gateScreen').style.display = 'block';
  document.getElementById('dataScreen').style.display = 'none';
}
function showData() {
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('dataScreen').style.display = 'block';
  loadData();
}

function hideErr() { document.getElementById('loginErr').style.display = 'none'; }
function showErr(msg) { var el = document.getElementById('loginErr'); el.textContent = msg; el.style.display = 'block'; }

async function doLogin() {
  hideErr();
  if (!ADMIN_LOGIN_URL) { showErr('Админка ещё не подключена — заполните ADMIN_LOGIN_URL после деплоя _tools/Admin/.'); return; }
  var password = document.getElementById('admin-password').value;
  if (!password) { showErr('Введите пароль.'); return; }
  var btn = document.getElementById('loginBtn');
  var original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Входим…';
  try {
    var res = await fetch(ADMIN_LOGIN_URL, { method: 'POST', body: JSON.stringify({ password: password }) });
    var data = await res.json();
    if (res.ok && data.token) {
      setToken(data.token);
      showData();
      return;
    }
    showErr(data && data.error === 'invalid_password' ? 'Неверный пароль.' : 'Что-то пошло не так. Попробуйте ещё раз.');
  } catch (e) {
    showErr('Не получилось связаться с сервером. Попробуйте ещё раз.');
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('admin-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

// Уже есть токен с прошлого раза в этой вкладке — не заставляем
// вводить пароль заново, просто пробуем загрузить данные (если токен
// истёк — loadData сама вернёт на экран входа при 401).
if (getToken()) { showData(); } else { showGate(); }
</script>
</body>
</html>
