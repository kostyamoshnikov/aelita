<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отмена регистрации — AELITA PRODUCTION</title>
<!--
  AELITA PRODUCTION · Events — страница-приёмник ссылки «Отменить
  регистрацию» из письма (pack-v296, см. Events/register.js и
  Events/lib/event-cancel-token.js).

  ⚠️ ПОЧЕМУ ОТМЕНА НЕ ПРОИСХОДИТ САМА ПРИ ОТКРЫТИИ ССЫЛКИ. Ссылка —
  обычный GET-переход по клику в письме, а сама отмена — POST на
  /events/cancel. Если бы страница отправляла этот POST сама, не
  дожидаясь действия человека, её выполнил бы и антивирус/почтовый
  сканер, который открывает ссылки из письма ДО того, как их увидит
  адресат (обычная практика корпоративной почты) — отмена случилась бы
  раньше, чем человек вообще прочитал письмо. Кнопка «Да, отменить»
  здесь не формальность, а единственная защита от этого сценария:
  сканеры не нажимают кнопки, только загружают страницы.

  Один и тот же токен использован дважды подряд (двойной клик,
  открытие в двух вкладках) — не ошибка, cancel.js отвечает тем же
  успехом на уже отменённую регистрацию своим кодом not_registered,
  который эта страница показывает как «уже было отменено», не как
  сбой (см. render() ниже).
-->
<style>
:root{--ink:#0B0B0D;--coal:#1A1A1F;--bone:#E8E6E1;--sand:#C9B8A3;--gold:#D6B57A;--ok:#B7C9A8;--warn:#C98B6B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:Inter,system-ui,sans-serif;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--coal);border-radius:8px;padding:32px 28px;max-width:420px;width:100%;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1{font-size:19px;font-weight:500;margin:0 0 10px}
p{font-size:14px;color:var(--sand);line-height:1.5;margin:0 0 20px}
button{background:var(--gold);color:var(--ink);border:none;padding:14px 24px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:default}
button.secondary{background:transparent;border:1px solid rgba(217,217,217,.3);color:var(--bone);margin-top:10px}
.status{font-size:15px;font-weight:500;margin:14px 0 4px}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}
a{color:var(--gold)}

/* pack-v520: длинное название документа не влезало в 320 px */
p,a{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="eyebrow">AELITA PRODUCTION</div>
  <h1 id="title">Отмена регистрации</h1>
  <p id="text">Проверяем ссылку…</p>
  <div id="actions"></div>
</div>
<p style="margin-top:20px;font-size:12px;color:rgba(201,184,163,.5);text-align:center">
  <a href="/privacy" style="color:rgba(201,184,163,.5)">Политика обработки персональных данных</a>
</p>
<script src="/assets/analytics-events.js"></script>
<script>
// pack-v467 (ТЗ клиентских текстов, З-1): язык страницы для строк,
// которые печатает скрипт. Сборщик EN содержимое <script> не
// переводит, поэтому пары RU/EN живут прямо здесь.
const EN = document.documentElement.lang === 'en';
// pack-v469 (ТЗ клиентских текстов, З-10): все тексты страницы — парами
// RU/EN. Сборщик EN строки внутри <script> не переводит (i18n/README,
// п. 7), и до этого английская страница показывала всё по-русски, кроме
// сетевой ошибки. ⚠️ EN-строки — без прямых апострофов («couldn't» в
// литерале в одинарных кавычках ломает весь скрипт), используем ’.
const tr = (ru, en) => (EN ? en : ru);
// Ссылки — целыми литералами, а не `${…}/account`: проверка ссылок
// аудита (links) читает href и в скриптах.
const CABINET_BTN = EN
  ? '<a href="/en/account/dashboard"><button>My account →</button></a>'
  : '<a href="/account/dashboard"><button>Личный кабинет →</button></a>';
const EVENTS_BTN = EN
  ? '<a href="/en/"><button class="secondary">All events</button></a>'
  : '<a href="/"><button class="secondary">Все события</button></a>';
const params = new URLSearchParams(location.search);
const token = params.get('token');
const API_BASE = 'https://api.aelita-production.ru/events';

function render(titleText, bodyText, statusClass, statusText, actionsHtml){
  document.getElementById('title').textContent = titleText;
  document.getElementById('text').innerHTML = bodyText;
  const actionsEl = document.getElementById('actions');
  actionsEl.innerHTML = (statusText ? `<div class="status ${statusClass}">${statusText}</div>` : '') + (actionsHtml || '');
}

if(!token){
  render(tr('Ссылка недействительна', 'Invalid link'),
    tr('В ссылке нет кода отмены — она могла быть скопирована не полностью. Откройте письмо ещё раз и нажмите на ссылку целиком, либо отмените регистрацию из личного кабинета.',
       'The link has no cancellation code — it may have been copied only in part. Open the email again and tap the full link, or cancel the registration from your account.'),
    'warn', null, CABINET_BTN);
} else {
  render(tr('Отмена регистрации', 'Cancel registration'),
    tr('Подтвердите отмену — место освободится для других участников.', 'Please confirm — your place will be freed up for someone else.'), null, null,
    `<button id="confirmBtn">${tr('Да, отменить', 'Yes, cancel')}</button><button class="secondary" onclick="history.back()">${tr('Не отменять', 'Keep it')}</button>`);
  document.getElementById('confirmBtn').addEventListener('click', doCancel);
}

async function doCancel(){
  const btn = document.getElementById('confirmBtn');
  const retryBtn = `<button onclick="doCancel()">${tr('Повторить', 'Try again')}</button>`;
  if (btn) { btn.disabled = true; btn.textContent = tr('Отменяем…', 'Cancelling…'); }
  try {
    const res = await fetch(API_BASE + '/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ cancel_token: token }),
    });
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.ok) {
      const quantityNote = data.quantity > 1 ? tr(` (все ${data.quantity} билета из этой регистрации)`, ` (all ${data.quantity} tickets in this registration)`) : '';
      const what = `«${escapeHtml(data.eventTitle || '')}»${data.datetimeLabel ? ', ' + escapeHtml(data.datetimeLabel) : ''}${quantityNote}`;
      render(tr('Регистрация отменена', 'Registration cancelled'),
        tr(`${what}. Место освободилось. Жаль, что в этот раз не получится — будем рады видеть вас на следующих встречах.`,
           `${what}. The place is now free. Sorry you can’t make it this time — we’d love to see you at future events.`),
        'ok', tr('Готово', 'Done'),
        CABINET_BTN + EVENTS_BTN);
    } else if (res.status === 404 || (data && data.error === 'not_registered')) {
      render(tr('Уже отменено', 'Already cancelled'),
        tr('Эта регистрация уже была отменена раньше (например, если вы уже нажимали эту ссылку) — повторно отменять нечего.',
           'This registration was already cancelled earlier (for example, if you had already used this link) — there is nothing left to cancel.'),
        'warn', null, CABINET_BTN);
    } else if (data && data.error === 'bad_cancel_token') {
      render(tr('Ссылка недействительна', 'Invalid link'),
        tr('Не удалось проверить код отмены — попробуйте открыть ссылку из письма ещё раз или отмените регистрацию из личного кабинета.',
           'We could not verify the cancellation code — try opening the link from the email again, or cancel the registration from your account.'),
        'warn', null, CABINET_BTN);
    } else {
      render(tr('Не получилось отменить', 'We couldn’t cancel'),
        tr('Сервер не смог обработать запрос — попробуйте ещё раз через минуту или отмените из личного кабинета.',
           'The server could not process the request — try again in a minute or cancel from your account.'),
        'warn', null, retryBtn);
    }
  } catch (e) {
    // pack-v334: сюда попадаем только когда ответа не пришло вовсе —
    // сервер, ответивший ошибкой, обрабатывается веткой выше. Частая
    // причина — VPN: страница открывается (GitHub Pages), а до API в
    // Yandex Cloud запрос не доходит. pack-v467: VPN назван как
    // возможная причина, рядом — адрес почты.
    render(tr('Не получилось отменить', 'We couldn’t cancel'),
      tr('Не получилось связаться с сервером. Если у вас включён VPN, попробуйте без него. Если не поможет — напишите нам, разберёмся: aelita.production@yandex.ru',
         'We couldn’t reach the server. If you’re using a VPN, try without it. If that doesn’t help, write to us: aelita.production@yandex.ru'),
      'warn', null, retryBtn);
  }
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}
</script>
</body>
</html>
