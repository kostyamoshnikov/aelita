<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль регистраций — AELITA PRODUCTION</title>
<!--
  AELITA PRODUCTION · Events — контроль на входе для бесплатных встреч.
  Закрывает DEPLOY.md, «Что осталось нерешённым», п.2: QR на билете
  бесплатной встречи печатается и подписывается уже давно
  (lib/registration-qr.js), но проверить его на входе было нечем.

  Дословная копия структуры Site/tickets-scan/ (PIN персонала, камера
  через jsQR + ручной ввод/сканер-пистолет, офлайн-очередь) — не
  переизобретено заново, только адаптированы поля (регистрация вместо
  билета, имя+мероприятие вместо места в зале) и эндпоинт
  (/events/check-in вместо /tickets/ticket-check). Расхождения с
  оригиналом отмечены пометкой «ОТЛИЧИЕ ОТ tickets-scan» по месту —
  если чините баг там, проверьте, не тот же ли баг и здесь.

  Код персонала (STAFF_ACCESS_CODE) — ТОТ ЖЕ секрет, что у
  tickets-scan, не отдельный: см. докстринг Events/check-in.js, почему
  один PIN на всех контролёров входа, а не два. Хранится в localStorage
  под СВОИМ ключом (aelita-events-staff-code) — секрет общий, но
  значения в localStorage разных страниц не должны зависеть друг от
  друга: контролёр может обновить код на этой странице отдельно от
  tickets-scan, если, например, открыл её первой в новой смене.

  Параметр ?event=<id> — привязывает страницу к конкретной встрече,
  та же роль, что ?performance=<id> у tickets-scan (см. Events/check-
  in.js про expected_event_id). Бейдж мероприятия здесь НЕ ходит на
  сервер за названием (в отличие от tickets-scan, которая запрашивает
  /tickets/availability) — публичного GET-эндпоинта «дать мне
  информацию о встрече по id» у Events нет, заводить его только ради
  строки в бейдже избыточно: сервер и так вернёт настоящее название в
  карточке результата при первом же скане (см. wrong_event/
  actualEventTitle), а до первого скана бейдж просто показывает сам
  ID из ссылки — этого достаточно, чтобы контролёр убедился, что открыл
  верную ссылку.
-->
<style>
:root{--ink:#0B0B0D;--coal:#1A1A1F;--bone:#E8E6E1;--sand:#C9B8A3;--gold:#D6B57A;--ok:#B7C9A8;--warn:#C98B6B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:Inter,system-ui,sans-serif;padding:20px;min-height:100vh}
#gate{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:50}
#gate h2{font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;color:var(--sand)}
#gate input{max-width:280px;text-align:center;font-size:20px;letter-spacing:.1em}
#gate button{background:var(--gold);color:var(--ink);border:none;padding:14px 28px;border-radius:4px;font-size:14px;cursor:pointer;max-width:280px;width:100%}
#gate .err{color:var(--warn);font-size:13px;margin:-4px 0 10px;min-height:16px}
#app{display:none}
h1{font-size:16px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px}
input{width:100%;background:var(--coal);border:1px solid rgba(217,217,217,.2);color:var(--bone);padding:16px;font-size:16px;border-radius:4px;margin-bottom:10px}
.card{background:var(--coal);border-radius:8px;padding:20px;margin-top:16px;text-align:center}
.card.ok{border:1px solid var(--ok)}
.card.warn{border:1px solid var(--warn)}
.name{font-size:20px;margin-bottom:4px}
.detail{color:var(--sand);font-size:14px;margin-bottom:14px}
.status{font-size:15px;font-weight:500;padding:6px 0}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}
button.action{background:var(--gold);color:var(--ink);border:none;padding:12px 20px;border-radius:4px;font-size:14px;margin:4px;cursor:pointer}
button.secondary{background:transparent;border:1px solid var(--sand);color:var(--bone)}
#queue-badge{display:none;background:var(--warn);color:var(--ink);font-size:11px;text-transform:uppercase;padding:6px 10px;border-radius:3px;text-align:center;margin-bottom:12px}
.help-fab{position:fixed;right:16px;bottom:16px;background:var(--coal);border:1px solid var(--sand);color:var(--bone);border-radius:24px;padding:12px 18px;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="gate">
  <h2>Код доступа персонала</h2>
  <div class="err" id="gate-err"></div>
  <input id="gate-input" placeholder="PIN" inputmode="numeric" autocomplete="off">
  <button id="gate-submit" style="margin-top:6px">Войти</button>
</div>

<div id="app">
<h1>Контроль регистраций</h1>
<div id="event-badge" style="display:none;color:var(--sand);font-size:13px;margin:-10px 0 14px"></div>
<div id="queue-badge"></div>
<input id="scan-input" placeholder="Наведите сканер или введите код вручную" autofocus>
<button class="action secondary" id="camera-toggle" style="width:100%;margin:0 0 10px">📷 Включить камеру</button>
<video id="camera-video" playsinline style="display:none;width:100%;border-radius:6px;margin-bottom:10px"></video>
<canvas id="camera-canvas" style="display:none"></canvas>
<div id="result"></div>
</div>

<a class="help-fab" href="tel:+79605151690">🆘 Позвать помощь</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="/assets/analytics-events.js"></script>
<script>
// ⚠️ Заполнить после деплоя Gateway (см. _tools/Gateway/README.md) —
// финальное значение https://api.aelita-production.ru/events
const API_BASE = 'https://api.aelita-production.ru/events';

// ─── Код доступа персонала — свой ключ localStorage, общий секрет с tickets-scan ──
const STAFF_CODE_KEY = 'aelita-events-staff-code';
function getStaffCode(){ return localStorage.getItem(STAFF_CODE_KEY) || ''; }
function setStaffCode(v){ localStorage.setItem(STAFF_CODE_KEY, v); }
function clearStaffCode(){ localStorage.removeItem(STAFF_CODE_KEY); }
function showGate(errMsg){
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gate-err').textContent = errMsg || '';
  document.getElementById('gate-input').focus();
}
function showApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('scan-input').focus();
}
document.getElementById('gate-submit').addEventListener('click', submitGate);
document.getElementById('gate-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitGate(); });
function submitGate(){
  const v = document.getElementById('gate-input').value.trim();
  if(!v){ document.getElementById('gate-err').textContent = 'Введите код'; return; }
  setStaffCode(v);
  showApp();
  // ОТЛИЧИЕ ОТ tickets-scan: там лёгкая проверка кода идёт через
  // action:'undo' с заведомо несуществующим orderId. Здесь тот же
  // приём: 'undo' с заведомо пустыми eventId/email — сервер ответит
  // 401 при неверном коде раньше, чем дойдёт до поиска регистрации.
  api('undo', { eventId: '__gate_check__', email: '' }).catch((e)=>{
    if(e instanceof UnauthorizedError){ /* уже обработано в api() — вернёт на gate */ }
  });
}
if(!getStaffCode()){ showGate(); } else { showApp(); }

// ?event=<id> — привязка к конкретной встрече, см. докстринг файла
// про то, почему бейдж не ходит на сервер за названием.
const expectedEventId = new URLSearchParams(location.search).get('event') || null;
if (expectedEventId) {
  const el = document.getElementById('event-badge');
  el.textContent = '📍 ' + expectedEventId;
  el.style.display = 'block';
}

const QUEUE_KEY = 'aelita-events-checkin-queue';
let currentToken = null;
let lastEventId = null;
let lastEmail = null;
let wakeLock = null;

async function requestWakeLock(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') requestWakeLock(); });
document.addEventListener('click', function once(){ requestWakeLock(); document.removeEventListener('click', once); }, {once:true});
requestWakeLock();

function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
function saveQueue(arr){ localStorage.setItem(QUEUE_KEY, JSON.stringify(arr)); updateBadge(arr.length); }
function updateBadge(n){ const el=document.getElementById('queue-badge'); if(n>0){ el.textContent='Не отправлено: '+n; el.style.display='block'; } else el.style.display='none'; }

class NetworkError extends Error {}
class UnauthorizedError extends Error {}
async function api(action, extra){
  let res;
  try{
    res = await fetch(`${API_BASE}/check-in`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, staffCode: getStaffCode(), ...extra })
    });
  }catch(e){
    throw new NetworkError('Нет связи с сервером');
  }
  if(res.status === 401){
    clearStaffCode();
    showGate('Код неверен или устарел — введите снова');
    throw new UnauthorizedError('unauthorized');
  }
  if(!res.ok){
    throw new Error('Сервер вернул ошибку: ' + res.status);
  }
  return res.json();
}

async function flushQueue(){
  const arr = getQueue();
  if(arr.length === 0) return;
  const remaining = [];
  for(const item of arr){
    try{ await api('checkin', {token: item.token, expected_event_id: item.expectedEventId || undefined}); }
    catch(e){ if(e instanceof NetworkError || e instanceof UnauthorizedError) remaining.push(item); }
  }
  saveQueue(remaining);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 15000);

const input = document.getElementById('scan-input');
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && input.value.trim()){
    handleScan(input.value.trim());
    input.value = '';
  }
});

// ─── Камера-сканер — дословно та же логика, что в tickets-scan ──────
let cameraStream = null;
let cameraLoopId = null;
let cameraLastCode = null;
let cameraLastAt = 0;
const CAMERA_COOLDOWN_MS = 2500;

const cameraToggleBtn = document.getElementById('camera-toggle');
const cameraVideo = document.getElementById('camera-video');
const cameraCanvas = document.getElementById('camera-canvas');
cameraToggleBtn.addEventListener('click', () => { cameraStream ? stopCamera() : startCamera(); });

async function startCamera(){
  if(typeof jsQR !== 'function'){
    document.getElementById('result').innerHTML = '<div class="card warn"><div class="status warn">Библиотека камеры не загрузилась (нет сети?) — используйте сканер или ручной ввод.</div></div>';
    return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    document.getElementById('result').innerHTML = '<div class="card warn"><div class="status warn">Камера недоступна (нет разрешения или устройства) — используйте сканер или ручной ввод.</div></div>';
    cameraStream = null;
    return;
  }
  cameraVideo.srcObject = cameraStream;
  cameraVideo.style.display = 'block';
  await cameraVideo.play();
  cameraToggleBtn.textContent = '📷 Выключить камеру';
  cameraLoopId = requestAnimationFrame(cameraTick);
}

function stopCamera(){
  if(cameraLoopId) cancelAnimationFrame(cameraLoopId);
  cameraLoopId = null;
  if(cameraStream){ cameraStream.getTracks().forEach((t) => t.stop()); }
  cameraStream = null;
  cameraVideo.style.display = 'none';
  cameraToggleBtn.textContent = '📷 Включить камеру';
}

function cameraTick(){
  if(!cameraStream) return;
  if(cameraVideo.readyState === cameraVideo.HAVE_ENOUGH_DATA){
    cameraCanvas.width = cameraVideo.videoWidth;
    cameraCanvas.height = cameraVideo.videoHeight;
    const ctx = cameraCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
    const frame = ctx.getImageData(0, 0, cameraCanvas.width, cameraCanvas.height);
    const code = jsQR(frame.data, frame.width, frame.height);
    if(code && code.data){
      const now = Date.now();
      if(!(code.data === cameraLastCode && now - cameraLastAt < CAMERA_COOLDOWN_MS)){
        cameraLastCode = code.data;
        cameraLastAt = now;
        handleScan(code.data);
      }
    }
  }
  cameraLoopId = requestAnimationFrame(cameraTick);
}

async function handleScan(token){
  currentToken = token;
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<div class="card">Проверяем…</div>';
  let data;
  try{
    data = await api('check', {token, expected_event_id: expectedEventId || undefined});
  }catch(e){
    if(e instanceof UnauthorizedError) return;
    const msg = e instanceof NetworkError
      ? 'Нет связи — попробуйте ещё раз или используйте ручной ввод позже.'
      : 'Сервер ответил с ошибкой — попробуйте ещё раз, если не поможет — звоните в «Позвать помощь».';
    resultEl.innerHTML = `<div class="card warn">${msg}</div>`;
    return;
  }
  render(data);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Разные причины отказа — разные действия контролёра, тот же принцип,
// что у CHECK_FAIL_MESSAGES в tickets-scan (pack-v267).
const CHECK_FAIL_MESSAGES = {
  bad_signature: 'Подпись QR не сходится — билет поддельный или испорчен. Не пропускать, позовите администратора.',
  registration_not_found: 'Регистрация не найдена — билет недействителен. Не пропускать.',
  registration_cancelled: 'Регистрация ОТМЕНЕНА — не пропускать. Если человек уверен, что не отменял запись, позовите администратора.',
};

function render(data){
  const resultEl = document.getElementById('result');
  if(!data.ok){
    const msg = data.error === 'wrong_event'
      ? `Билет с ДРУГОЙ встречи${data.actualEventTitle ? ' («' + escapeHtml(data.actualEventTitle) + '»)' : ''} — не пропускать`
      : (CHECK_FAIL_MESSAGES[data.error] || 'Билет не найден или недействителен');
    resultEl.innerHTML = `<div class="card warn"><div class="status warn">${msg}</div></div>`;
    return;
  }
  lastEventId = data.eventId;
  lastEmail = data.email;
  const already = data.alreadyCheckedIn;
  resultEl.innerHTML = `
    <div class="card ${already?'warn':'ok'}">
      <div class="name">${escapeHtml(data.name)}</div>
      <div class="detail">${escapeHtml(data.eventTitle)}${data.venueName ? ' · ' + escapeHtml(data.venueName) : ''}</div>
      <div class="status ${already?'warn':'ok'}">${already ? 'Уже отмечен на входе' : 'Регистрация действительна'}</div>
      ${!already ? '<button class="action" onclick="confirmCheckin()">Пропустить</button>' : '<button class="action secondary" onclick="undoCheckin()">Отменить отметку</button>'}
    </div>`;
}

async function confirmCheckin(){
  try{
    const data = await api('checkin', {token: currentToken, expected_event_id: expectedEventId || undefined});
    render(data);
  }catch(e){
    if(e instanceof UnauthorizedError) return;
    if(e instanceof NetworkError){
      const arr = getQueue();
      arr.push({token: currentToken, expectedEventId, ts: Date.now()});
      saveQueue(arr);
      document.getElementById('result').innerHTML = '<div class="card ok"><div class="status ok">Пропущен (сохранено офлайн, отправим при связи)</div></div>';
    } else {
      document.getElementById('result').innerHTML = '<div class="card warn"><div class="status warn">Сервер ответил с ошибкой — попробуйте ещё раз или позовите помощь.</div></div>';
    }
  }
}

async function undoCheckin(){
  try{
    const data = await api('undo', { eventId: lastEventId, email: lastEmail });
    if(data.ok){
      document.getElementById('result').innerHTML = '<div class="card ok"><div class="status ok">Отметка снята</div></div>';
    } else {
      document.getElementById('result').innerHTML = '<div class="card warn"><div class="status warn">Не удалось отменить — попробуйте ещё раз</div></div>';
    }
  }catch(e){
    if(e instanceof UnauthorizedError) return;
    const msg = e instanceof NetworkError ? 'Нет связи — попробуйте ещё раз.' : 'Сервер ответил с ошибкой — попробуйте ещё раз.';
    document.getElementById('result').innerHTML = `<div class="card warn">${msg}</div>`;
  }
}

if(getStaffCode()) flushQueue();
</script>
</body>
</html>
