<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арт-города — AELITA PRODUCTION</title>
<!-- Страница переехала: /lecture-alexandra-gubanova/ → /lecture-art-goroda/ (pack-v418).
     Слаги лекций переведены с «имя-фамилия» на «название лекции»:
     у Кати Абдуловой их две, и адрес по спикеру больше не адресует
     однозначно (FRAGILE_SLUGS_AND_IMAGES.md, п. 1.1). Переименованы
     все пять сразу, а не только конфликтующая — иначе схема осталась
     бы полуторной, как это уже дважды выходило с персоналиями.
     Этот файл — только редирект: уже разосланные ссылки, QR на
     печатных материалах и выдача поисковиков не должны отдавать 404.
     Содержимого здесь нет и быть не должно.
     В sitemap.xml НЕ добавляется (см. Site/README.md). -->
<link rel="canonical" href="https://aelita-production.ru/lecture-art-goroda/">
<meta name="robots" content="noindex, follow">
<!-- PRESERVE_QUERY, pack-v422: meta-refresh теряет строку запроса — QR на
     печатных материалах и ссылки в постах несут ?utm_*, и после перехода
     визит приходил на новый адрес без меток, с реферером собственного
     домена, то есть попадал в «прямые заходы». Этот скрипт выполняется при
     разборе <head> раньше, чем сработает meta ниже, и переносит ?query и
     #якорь на новый адрес. Без JS работает прежний meta-refresh. -->
<script>(function(){try{var q=location.search||"",h=location.hash||"";if(q||h)location.replace("/lecture-art-goroda/"+q+h);}catch(e){}})();</script>
<meta http-equiv="refresh" content="0; url=/lecture-art-goroda/">
<meta name="theme-color" content="#0B0B0D">
<link rel="shortcut icon" href="/favicon.ico">
<style>
  body{background:#0B0B0D;color:#E8E6E1;font-family:sans-serif;font-weight:300;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  a{color:#D6B57A}
</style>
</head>
<body>
<div>
  <p>Страница переехала.</p>
  <p><a href="/lecture-art-goroda/">Перейти на новый адрес →</a></p>
</div>
<script>location.replace('/lecture-art-goroda/');</script>
</body>
