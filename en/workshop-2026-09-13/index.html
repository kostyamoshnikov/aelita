<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Meeting — Main Stream — AELITA PRODUCTION</title>
<!-- Страница переехала: /workshop-2026-09-13/ → /workshop-main/ (pack-v340).
     Дата ушла из адреса: встреча не состоялась в сентябре и будет
     проведена позже, а страница остаётся единственной точкой входа
     на курс — адрес с датой быстро стал бы неправдой.
     Этот файл — только редирект, чтобы уже разосланные ссылки, QR на
     печатных материалах и выдача поисковиков не отдавали 404.
     Содержимого здесь нет и быть не должно.
     В sitemap.xml НЕ добавляется (см. Site/README.md). -->
<link rel="canonical" href="https://aelita-production.ru/en/workshop-main/">
<meta name="robots" content="noindex, follow">
<!-- PRESERVE_QUERY, pack-v422: meta-refresh теряет строку запроса — QR на
     печатных материалах и ссылки в постах несут ?utm_*, и после перехода
     визит приходил на новый адрес без меток, с реферером собственного
     домена, то есть попадал в «прямые заходы». Этот скрипт выполняется при
     разборе <head> раньше, чем сработает meta ниже, и переносит ?query и
     #якорь на новый адрес. Без JS работает прежний meta-refresh. -->
<script>(function(){try{var q=location.search||"",h=location.hash||"";if(q||h)location.replace("/en/workshop-main/"+q+h);}catch(e){}})();</script>
<meta http-equiv="refresh" content="0; url=/en/workshop-main/">
<meta name="theme-color" content="#0B0B0D">
<link rel="shortcut icon" href="/favicon.ico">
<style>
  body{background:#0B0B0D;color:#E8E6E1;font-family:sans-serif;font-weight:300;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  a{color:#D6B57A}
</style>
</head>
<body>
<div>
  <p>This page has moved.</p>
  <p><a href="/en/workshop-main/">Go to the meeting →</a></p>
</div>
<script>location.replace('/en/workshop-main/');</script>
</body>
</html>
