<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>“Tochka Cuire” — AELITA PRODUCTION</title>
<!-- Страница переехала: /en/tochkacuiri/ → /en/tochkacuire/ (pack-v405).
     Опечатка в адресе фестиваля: было «cuiri», стало «cuire». Русский
     редирект /tochkacuiri/ стоял с pack-v340, а английской пары у него
     не было — /en/tochkacuiri/ отдавал 404. Найдено сплошной сверкой
     всех 22 переездов слагов: это единственный из них, где английская
     половина отсутствовала.
     Этот файл — только редирект: на опечатанный адрес могли остаться
     внешние ссылки и выдача поисковиков, они не должны упираться в 404.
     Содержимого здесь нет и быть не должно.
     В sitemap.xml НЕ добавляется (см. Site/README.md). -->
<link rel="canonical" href="https://aelita-production.ru/en/tochkacuire/">
<meta name="robots" content="noindex, follow">
<!-- PRESERVE_QUERY, pack-v422: meta-refresh теряет строку запроса — QR на
     печатных материалах и ссылки в постах несут ?utm_*, и после перехода
     визит приходил на новый адрес без меток, с реферером собственного
     домена, то есть попадал в «прямые заходы». Этот скрипт выполняется при
     разборе <head> раньше, чем сработает meta ниже, и переносит ?query и
     #якорь на новый адрес. Без JS работает прежний meta-refresh. -->
<script>(function(){try{var q=location.search||"",h=location.hash||"";if(q||h)location.replace("/en/tochkacuire/"+q+h);}catch(e){}})();</script>
<meta http-equiv="refresh" content="0; url=/en/tochkacuire/">
<meta name="theme-color" content="#0B0B0D">
<link rel="shortcut icon" href="/favicon.ico">
<style>
  body{background:#0B0B0D;color:#E8E6E1;font-family:sans-serif;font-weight:300;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  a{color:#D6B57A}
</style>
</head>
<body>
<div>
  <p>This page has moved.</p>
  <p><a href="/en/tochkacuire/">Go to the “Tochka Cuire” festival →</a></p>
</div>
<script>location.replace('/en/tochkacuire/');</script>
</body>
</html>
