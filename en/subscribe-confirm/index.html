<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirm your subscription — AELITA PRODUCTION</title>
<!--
  AELITA PRODUCTION · Рассылка новостей — страница ссылки из письма
  «подтвердите подписку» (pack-v728, double opt-in: Яндекс требует от
  рассылок, чтобы адрес подтвердил сам получатель). Письмо пишет
  _tools/Inbox/lib/newsletter-mail.js (buildConfirmMessage): ссылка
  ?s=<id подписчика>&c=<токен подтверждения>; подтверждает Inbox/leads.js —
  POST { action: 'nl_confirm', s, c }.

  ⚠️ ПОДТВЕРЖДЕНИЕ — ТОЛЬКО ПО КНОПКЕ, не при открытии страницы: почтовые
  сканеры открывают ссылки из писем сами, раньше человека, — подтверждение
  при открытии подтверждало бы адреса без их владельцев (как отписка на
  /unsubscribe/).

  Повторное нажатие (двойной клик, старое письмо) — не ошибка: «уже
  подтверждена». Не подтвердил за 7 дней — запись удалена: «ссылка устарела»,
  подписаться снова. Отписался — старая ссылка подписку не возвращает.
-->
<style>
:root{--ink:#0B0B0D;--coal:#1A1A1F;--bone:#E8E6E1;--sand:#C9B8A3;--gold:#D6B57A;--ok:#B7C9A8;--warn:#C98B6B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:Inter,system-ui,sans-serif;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:var(--coal);border-radius:8px;padding:32px 28px;max-width:420px;width:100%;text-align:center}
.eyebrow{font-size:0.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1{font-size:1.1875rem;font-weight:500;margin:0 0 10px}
p{font-size:0.875rem;color:var(--sand);line-height:1.5;margin:0 0 20px}
/* pack-v712: основная — золотая рамка, как по всему сайту */
button{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:14px 24px;border-radius:4px;font-size:0.875rem;font-weight:500;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:default}
button.secondary{background:transparent;border:1px solid rgba(217,217,217,.3);color:var(--bone);margin-top:10px}
.status{font-size:0.9375rem;font-weight:500;margin:14px 0 4px}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}
a{color:var(--gold)}
.foot{margin-top:20px;font-size:0.75rem;color:rgba(201,184,163,.7);text-align:center}
.foot a{color:rgba(201,184,163,.7)}

/* pack-v520: длинное название документа не влезало в 320 px */
p,a{overflow-wrap:anywhere}

/* pack-v530: единые кнопки — копия правил assets/style.css (у страницы
   свой шаблон без общих стилей). Основная — золотая заливка; вторичная —
   тонкая рамка; компактная — 11px, 10×18. */
body :is(.btn-gold,.buy-btn,.install-btn,.retry-btn,.promo-apply){font-family:'Montserrat',sans-serif!important;font-weight:400!important;text-transform:uppercase!important;font-size:0.75rem!important;letter-spacing:.22em!important;line-height:1.35!important;padding:15px 30px!important;border-radius:0!important;text-decoration:none!important}
body :is(.btn-gold,.buy-btn,.install-btn){background:var(--gold)!important;color:var(--ink)!important;border:1px solid var(--gold)!important}
body :is(.retry-btn,.promo-apply){background:transparent!important;color:var(--bone)!important;border:1px solid rgba(214,181,122,.5)!important}
body :is(.retry-btn,.promo-apply):hover{border-color:var(--gold)!important;color:var(--gold)!important}
body .promo-apply{font-size:0.75rem!important;letter-spacing:.16em!important;padding:10px 18px!important}
body :is(.btn-gold,.buy-btn,.promo-apply):disabled{opacity:.45!important;cursor:not-allowed!important}
@media(max-width:600px){body :is(.btn-gold,.buy-btn,.install-btn,.retry-btn){font-size:0.75rem!important;letter-spacing:.16em!important;padding:13px 20px!important}}
</style>
<!-- pack-v715: версия для слабовидящих — общий режим сайта (у страницы свой шаблон без main.js и style.css; копии собирает _tools/DesignSystem/a11y/build_a11y_standalone.py) -->
<link rel="stylesheet" href="/assets/a11y.css?v=143">
<script src="/assets/a11y.js?v=143"></script>
</head>
<body>
<div class="card" id="card">
  <div class="eyebrow">AELITA PRODUCTION</div>
  <h1 id="title">Confirm your subscription</h1>
  <p id="text">Checking your link…</p>
  <div id="actions"></div>
</div>
<p class="foot">
  <a href="/en/privacy">Personal Data Processing Policy</a>
</p>
<script src="/assets/analytics-events.js"></script>
<script>
// Сборщик EN содержимое <script> не переводит (i18n/README, п. 7) —
// тексты парами RU/EN прямо здесь. ⚠️ В EN-строках — ’, не прямой апостроф.
const EN = document.documentElement.lang === 'en';
const tr = (ru, en) => (EN ? en : ru);
// Ссылки — целыми литералами: проверка ссылок аудита читает href и в скриптах.
const HOME_BTN = EN
  ? '<a href="/en/"><button class="secondary">To the website</button></a>'
  : '<a href="/"><button class="secondary">На сайт</button></a>';
const SUBSCRIBE_BTN = EN
  ? '<a href="/en/#subscribe"><button>Subscribe again</button></a>'
  : '<a href="/#subscribe"><button>Подписаться снова</button></a>';
const MAIL = 'aelita.production@yandex.ru';
const params = new URLSearchParams(location.search);
const sid = params.get('s') || '';
const code = params.get('c') || '';
const API = 'https://api.aelita-production.ru/leads';

function render(titleText, bodyText, statusClass, statusText, actionsHtml) {
  document.getElementById('title').textContent = titleText;
  document.getElementById('text').textContent = bodyText;
  document.getElementById('actions').innerHTML = (statusText ? `<div class="status ${statusClass}">${statusText}</div>` : '') + (actionsHtml || '');
}
function badLink() {
  render(tr('Ссылка недействительна', 'Invalid link'),
    tr(`Похоже, ссылка скопировалась не полностью. Откройте письмо ещё раз и нажмите «Подтвердить подписку» — или напишите нам на ${MAIL}.`,
       `The link seems to be incomplete. Open the email again and tap “Confirm subscription” — or write to us at ${MAIL}.`),
    'warn', null, HOME_BTN);
}
function failed(text) {
  render(tr('Не получилось подтвердить', 'We couldn’t confirm your subscription'), text, 'warn', null,
    `<button id="retryBtn">${tr('Повторить', 'Try again')}</button>` + HOME_BTN);
  document.getElementById('retryBtn').addEventListener('click', doConfirm);
}

if (!/^[0-9a-f]{64}$/.test(sid) || !/^[0-9a-f]{32}$/.test(code)) {
  badLink();
} else {
  render(tr('Подтвердить подписку?', 'Confirm your subscription?'),
    tr('Будем присылать новости AELITA PRODUCTION: премьеры, фестивали, старт продаж. Отписаться можно в любой момент — ссылкой в каждом письме.',
       'We’ll send you AELITA PRODUCTION news: premieres, festivals and ticket sales. You can unsubscribe at any time with the link in every email.'),
    null, null,
    `<button id="confirmBtn">${tr('Подтвердить подписку', 'Confirm subscription')}</button>` + HOME_BTN);
  document.getElementById('confirmBtn').addEventListener('click', doConfirm);
}

async function doConfirm() {
  const btn = document.getElementById('confirmBtn') || document.getElementById('retryBtn');
  if (btn) { btn.disabled = true; btn.textContent = tr('Подтверждаем…', 'Confirming…'); }
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ action: 'nl_confirm', s: sid, c: code }),
    });
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.ok) {
      render(data.already ? tr('Подписка уже подтверждена', 'Already confirmed') : tr('Подписка подтверждена', 'Subscription confirmed'),
        tr('Спасибо! Новости будут приходить на эту почту. Отписаться можно ссылкой в любом письме.',
           'Thank you! News will come to this address. You can unsubscribe with the link in any email.'),
        'ok', tr('Готово', 'Done'), HOME_BTN);
    } else if (data && data.error === 'expired') {
      render(tr('Ссылка устарела', 'The link has expired'),
        tr('Подтверждения ждали 7 дней, и адрес уже удалён из списка. Если хотите получать новости — подпишитесь снова на сайте.',
           'We waited 7 days for confirmation, and the address has already been removed. If you’d like our news, subscribe again on the website.'),
        'warn', null, SUBSCRIBE_BTN + HOME_BTN);
    } else if (data && data.error === 'unsubscribed') {
      render(tr('Вы отписались от рассылки', 'You’ve unsubscribed'),
        tr('Эта ссылка больше не действует. Подписаться снова можно на сайте.',
           'This link no longer works. You can subscribe again on the website.'),
        'warn', null, SUBSCRIBE_BTN + HOME_BTN);
    } else if (data && data.error === 'bad_link') {
      badLink();
    } else {
      failed(tr(`Сервер не смог обработать запрос — попробуйте через минуту или напишите нам: ${MAIL}`,
                `The server could not process the request — try again in a minute or write to us: ${MAIL}`));
    }
  } catch (e) {
    // Ответа не пришло вовсе — частая причина VPN (страница открылась, до
    // API в Яндекс Облаке запрос не дошёл).
    failed(tr(`Не получилось связаться с сервером. Если у вас включён VPN, попробуйте без него. Если не поможет — напишите нам: ${MAIL}`,
              `We couldn’t reach the server. If you’re using a VPN, try without it. If that doesn’t help, write to us: ${MAIL}`));
  }
}
</script>
<script src="/assets/outage.js?v=143" defer></script>
</body>
</html>
