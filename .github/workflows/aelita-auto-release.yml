name: AELITA automatic release

on:
  push:
    branches: [ops/auto-release]
    paths:
      - .github/workflows/aelita-auto-release.yml
      - ops/auto-release/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.candidate.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check the launcher
        run: |
          python3 ops/auto-release/release.py self-test
          python3 -m unittest discover -s ops/auto-release
      - name: Check the release request
        id: candidate
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          request=ops/auto-release/release.json
          if [ ! -f "$request" ]; then
            echo 'No release was requested.'
            exit 0
          fi
          if [ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$EVENT_BEFORE"
            if git diff --quiet "$EVENT_BEFORE" HEAD -- "$request"; then
              echo 'Release request unchanged.'
              exit 0
            fi
          fi
          python3 ops/auto-release/release.py validate "$request"
          echo 'release=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aelita-production-release
      cancel-in-progress: false
    environment: aelita-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish using the existing AELITA release process
        env:
          AELITA_RELEASE_BUCKET: ${{ vars.AELITA_RELEASE_BUCKET }}
          AELITA_RELEASE_S3_KEY_ID: ${{ secrets.AELITA_RELEASE_S3_KEY_ID }}
          AELITA_RELEASE_S3_SECRET: ${{ secrets.AELITA_RELEASE_S3_SECRET }}
          YC_S3_KEY_ID: ${{ secrets.AELITA_YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.AELITA_YC_S3_SECRET }}
          GITHUB_TOKEN: ${{ secrets.AELITA_GITHUB_PAGES_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.AELITA_CLOUDFLARE_TOKEN }}
        run: |
          latest="$(git ls-remote origin refs/heads/ops/auto-release)" || exit 1
          if [ "${latest%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/ops/auto-release
            if ! git diff --quiet HEAD FETCH_HEAD -- ops/auto-release/release.json; then
              echo 'A newer release request is present. This run will not deploy.'
              exit 0
            fi
          fi
          python3 ops/auto-release/release.py deploy ops/auto-release/release.json
